[project]
name = "u-tilise"
version = "0.1.0"
description = "U-TILISE fork on Python 3.12 with uv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.5.3",
  "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
scripts = [
    "h5py>=3.16.0",
    "kornia>=0.8.3",
    "matplotlib>=3.11.2",
    "nestargs>=2.1.0",
    "numba>=0.67.0",  # lib/models/ImageSeriesInterpolator.py
    "omegaconf>=2.3.1",
    "prodict>=0.8.22",
    "pyyaml>=6.0.3",
    "tensorboard>=2.21.0",  # torch.utils.tensorboard in lib/trainer.py
    "torchgeometry>=0.1.2",  # SSIM loss/metric (lib/loss.py, lib/metrics.py)
    "torchinfo>=1.8.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
    "wandb>=0.30.0",  # lib/trainer.py
]

# The network is a package (src/utilise/, symlinks to lib/models/) that other projects depend
# on; a library does not pin a torch build, so torch comes from PyPI unless the application
# that installs it pins one.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utilise"]

[tool.uv]
default-groups = ["dev", "scripts"]  # `uv sync` here still installs what the scripts need

[tool.ruff]
# Upstream U-TILISE code keeps its own style (src/utilise/ links to it).
extend-exclude = ["lib", "src", "toolbox", "run_train.py", "run_eval.py", "demo.ipynb"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
